name: Deploy ForgeFit Frontend

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      
      - name: 🔨 Build Frontend
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔨 Building Frontend Application"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 Build Configuration:"
          echo "   Environment: PRODUCTION"
          echo "   NODE_ENV: $NODE_ENV"
          echo "   API URL: $NEXT_PUBLIC_API_URL"
          echo "   Node: $(node --version)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📥 Installing dependencies..."
          npm ci
          echo ""
          echo "🔨 Building for PRODUCTION..."
          npm run build
          echo ""
          echo "✅ Production build completed"
      
      - name: 📦 Package Frontend
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          ARCHIVE_NAME="forgefit-frontend-deploy-${TIMESTAMP}.tar.gz"
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV
          echo "Creating deployment archive: ${ARCHIVE_NAME}..."
          # Create archive in /tmp to avoid any conflicts
          tar -czf /tmp/${ARCHIVE_NAME} \
            --exclude='.git' \
            --exclude='*.log' \
            --exclude='.env.backup.local' \
            --exclude='.env.development' \
            --exclude='node_modules/.cache' \
            --exclude='node_modules/.bin/.cache' \
            --exclude='.next/cache' \
            --exclude='.next/trace' \
            .
          # Move to current directory for upload
          mv /tmp/${ARCHIVE_NAME} .
          echo "✅ Package created: $(du -h ${ARCHIVE_NAME} | cut -f1)"
      
      - name: 📤 Upload to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "forgefit-frontend-deploy-*.tar.gz"
          target: "/var/www"
      
      - name: 🚀 Deploy and Restart Frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            
            echo "📦 Deploying Frontend..."
            cd /var/www/forgefit-frontend
            
            # Find the most recent archive
            LATEST_ARCHIVE=$(ls -t /var/www/forgefit-frontend-deploy-*.tar.gz 2>/dev/null | head -n 1)
            
            if [ -z "$LATEST_ARCHIVE" ]; then
              echo "❌ Error: No deployment archive found"
              exit 1
            fi
            
            echo "Using archive: $(basename $LATEST_ARCHIVE)"
            
            # Backup current deployment
            if [ -d ".next" ]; then
              BACKUP_NAME="../forgefit-frontend-backup-$(date +%Y%m%d-%H%M%S).tar.gz"
              echo "Creating backup: $(basename $BACKUP_NAME)..."
              tar -czf $BACKUP_NAME .next node_modules 2>/dev/null || true
            fi
            
            # Remove old files
            rm -rf node_modules .next
            
            # Extract new deployment
            tar -xzf "$LATEST_ARCHIVE"
            
            # Fix permissions
            chmod -R u+r,go+r node_modules
            find node_modules/.bin -type f -exec chmod +x {} \; 2>/dev/null || true
            
            # Verify deployment
            if [ -f "/var/www/verify-deployment.sh" ]; then
              /var/www/verify-deployment.sh || echo "⚠️ Verification found issues, but continuing..."
            fi

            cd ..
            
            echo "🔄 Restarting frontend service..."
            pm2 restart forgefit-frontend || pm2 start ecosystem.config.js --only forgefit-frontend
            
            echo ""
            echo "✅ Frontend deployment completed!"
            pm2 status forgefit-frontend
            
            # Clean up: Remove the archive we just used
            echo ""
            echo "🧹 Cleaning up deployment archive..."
            rm -f "$LATEST_ARCHIVE"
            
            # Clean up old archives (keep last 3 backups)
            echo "🧹 Cleaning up old backups (keeping last 3)..."
            cd /var/www
            ls -t forgefit-frontend-backup-*.tar.gz 2>/dev/null | tail -n +4 | xargs rm -f 2>/dev/null || true
            
            echo "✅ Cleanup completed"
      
      - name: ✅ Deployment Summary
        run: |
          echo "## 🚀 Frontend Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Frontend has been deployed and restarted." >> $GITHUB_STEP_SUMMARY
